<h1>Register</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>Name<input id="register-name" formControlName="name"></label><label>Email<input id="register-email" type="email" formControlName="email"></label><label>Password<input id="register-password" type="password" formControlName="password"></label>@if(form.touched && form.invalid){<small>Please complete all fields correctly.</small>}<button id="register-submit" type="submit">Create account</button><p>Already registered? <a routerLink="/login">Login</a></p></form>
