<h1>Login</h1><form [formGroup]="form" (ngSubmit)="submit()"><label>Email<input id="login-email" type="email" formControlName="email">@if(form.controls.email.touched && form.controls.email.invalid){<small>Enter a valid email.</small>}</label><label>Password<input id="login-password" type="password" formControlName="password">@if(form.controls.password.touched && form.controls.password.invalid){<small>Use at least 6 characters.</small>}</label><button id="login-submit" type="submit">Login</button><p>No account? <a routerLink="/register">Register</a></p></form>
