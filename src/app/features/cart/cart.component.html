<h1>Your cart</h1>
@if (cart.items().length === 0) { <div class="message"><p>Your cart is empty.</p><a routerLink="/products">Continue shopping</a></div> }
@else { <div class="cart-list">@for (item of cart.items(); track item.product.id) { <article><img [src]="item.product.image" [alt]="item.product.title"><div><h2>{{ item.product.title }}</h2><p>{{ item.product.price | currency }}</p></div><label>Quantity<input type="number" min="1" [value]="item.quantity" (change)="cart.updateQuantity(item.product.id, +$any($event.target).value)"></label><button class="secondary" type="button" (click)="cart.remove(item.product.id)">Remove</button></article> }</div><div class="summary"><strong>Total: {{ cart.total() | currency }}</strong><a class="button" routerLink="/checkout">Checkout</a></div> }
