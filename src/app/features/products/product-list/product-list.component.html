<section>
  <div class="heading"><div><h1>Products</h1><p>Browse our simple product catalogue.</p></div>
    <label>Category
      <select [value]="selectedCategory()" (change)="setCategory($any($event.target).value)">
        <option value="all">All categories</option>
        @for (category of categories(); track category) { <option [value]="category">{{ category }}</option> }
      </select>
    </label>
  </div>
  @if (loading()) { <app-loading-spinner /> }
  @else if (error()) { <div class="message error"><p>{{ error() }}</p><button type="button" (click)="retry()">Try again</button></div> }
  @else { <div class="grid">@for (product of filteredProducts(); track product.id) { <app-product-card [product]="product" (addToCart)="addToCart($event)" /> } @empty { <p>No products found.</p> }</div> }
</section>
